name: Publish Scripture Book

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install qrcode

      - name: Generate EPUB Book
        run: |
          python scripts/build.py

      - name: Generate Typst Document and QR codes
        run: |
          python scripts/build_typst.py

      - name: Setup Typst
        uses: typst-community/setup-typst@v3

      - name: Compile PDF
        run: |
          typst compile dist/book.typ dist/manuscript.pdf

      - name: Upload PDF Artifact
        uses: actions/upload-artifact@v4
        with:
          name: manuscript-pdf
          path: dist/manuscript.pdf

      - name: Upload EPUB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: manuscript-epub
          path: dist/beyond_the_prompt.epub
