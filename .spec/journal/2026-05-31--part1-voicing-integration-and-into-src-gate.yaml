discoveries:
  - The build (build_typst.py) has NO Part-divider / half-title construct. A front-porch
    two-part structure requires a new #part-divider in template.typ + a build branch.
    Half-title page design is a book-design decision that is Michael's.
  - preprocess_html_blocks strips only production-note and cycle-list -- NOT <!-- -->
    comments. The Part 1 drafts (which carry DRAFT + PROVENANCE comments) would leak that
    text into the rendered PDF if dropped into src/ as-is. Conversion is required.
  - book.yaml's explicit ordered chapters: list is the structural backbone. Wiring Part 1
    in is reversible, but WHERE it sits + whether the doctrine chapters renumber is a
    decision that ripples through every cross-reference and all 17 provenance files.
  - SPEC-GAP caught by the Adjacent Surface Audit: copilot-instructions #1 + CLAUDE.md
    mandate the Modular Study Format (Binding Question / Anchor Passage / Core Reframe /
    Engineering Parallel / Becoming Commitment) on EVERY chapter. Part 1 deliberately uses
    a different practice format. Without an explicit carve-out, a future agent will "fix"
    Part 1 by jamming the doctrine format into it.
  - Stewardship judgment: "go ahead and work it into the book chapters" authorized
    execution, but execution requires authorial decisions (numbering, preface, divider
    design) that are Michael's vision, not code-within-intent. The right move was to do
    every clearly-delegated thing (draft -> voice -> integrate, all verified + committed)
    and surface the fork -- not to barrel through because I was told to. This is the
    yes-agent correction applied in the other direction: not timidity, but knowing where
    my stewardship ends and his vision begins.

