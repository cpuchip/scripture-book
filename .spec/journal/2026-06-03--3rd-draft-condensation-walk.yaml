discoveries:
  - The CLAIM MAP (one line per paragraph = its core assertion) is the fatigue
    detector. Near-duplicate claim lines are the repetition, made visible — and it
    distinguishes the legitimate scar->principle->implementation spiral (each touch
    ADDS) from a pure restatement that adds nothing (P1's ¶7, P4's ¶3). The
    calibration that held all walk: hunt restatements-that-add-nothing, not the
    natural build of a single-thesis chapter.
  - THE WALK RULE (emerged at Ch 0, ratified): when a chapter's EP previews material
    another chapter OWNS, flag it and decide the trim AT the owning chapter — never
    cut a preview before comparing it to the full treatment. This drove the biggest
    wins: the cross-chapter EP de-duplication (Ch3->Part One; Ch0->Ch5; Ch1->Ch4;
    Ch4->Ch11; Ch12->Ch7), each resolved when the walk reached the owner.
  - The Engineering-Parallel re-eval (Michael's added scope, from the never-executed
    front-porch trim) paid off exactly where predicted: the EPs that re-taught Part
    One (Ch3) or re-walked their own Core Reframe (Ch9) were the real bloat. The EPs
    that were DELIBERATE rebuilds (Ch8 developer-loop, Ch10 gardening/mirror, Ch12
    ward-council) earned their place untouched.
  - Meditative closes get a pass on the 3× rule: the coda and the Epilogue both circle
    one image, but each paragraph ADVANCES the subject (a build, not a restatement).
    Michael kept the coda; the Epilogue held by the same precedent.
  - Condensation reduces FATIGUE more than PAGES: 122->121 pages, because prose cuts
    reflow within pages rather than dropping whole pages. The win is the reading
    experience (no more "you said this already"), which the page count understates.
  - PyMuPDF false-negatives have two causes worth remembering: add_chapter_xrefs
    inserts "(p. NN)" mid-phrase (breaks a space-stripped search across "Chapter N"),
    and EB Garamond hyphenates words across lines. Always confirm a NOT-FOUND against
    raw page text before believing a render broke.
