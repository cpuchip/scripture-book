discoveries:
  - "AskUserQuestion-driven council is a clean shape for structured collaboration. Eight
    items, each presented with concrete recommendation + 2-4 options. Michael could
    ratify, modify, or redirect on each. No ambiguity about what was decided. Worth
    re-using for similar future councils."
  - "The hope-and-the-grammar-of-pairs study sharpened the Atonement verb from 'recovering'
    (passive, after-the-fact) to 're-aiming' (active, vision-discipline). Repentance as
    re-aiming of the eye is the doctrinally accurate framing — and the verb shift gives
    the eleven-step list a more tactile motion. Michael's intuition that a study could
    sharpen the verb was correct."
  - "Voice audit confirmed the book ALREADY follows its own pronoun convention. The
    convention note in the Preface formalizes what is already true. Authors of modular
    studies tend to write Becoming Commitments in first-person naturally; the discipline
    held without an explicit rule. Worth noting for future projects."
  - "Cross-pollination across workstreams: the teaching workstream's Episode 2 script
    (2026-05-23) had already done the verb-pairing work for the seven framework-untouched
    steps. The book's reference page borrowed those verbs verbatim. Two products from the
    same source material reinforcing each other. The Episode 2 script's verb-pairings are
    now load-bearing for both the video and the book."
  - "The book's most important new content is arguably the Ch 6 production-note sidebar
    rather than any of the manuscript fixes. It turns a real failure of process into the
    book's strongest credibility moment. The book teaches the bilateral covenant; the book
    records its own covenant break and recovery. That recursive honesty is the rarest
    feature in a teaching book."

