summary: |
  Michael and Claude Opus 4.7 (Claude Code) ran a structured council on all open items from
  the 2026-05-26 audit. Used AskUserQuestion repeatedly for clean ratification — each item
  presented with concrete recommendation + brief rationale + 2-4 options. Michael ratified
  or modified each in turn. All 7 manuscript / soft-precision items and all 6 cross-chapter
  tensions closed in one session.

  Council ratifications applied in this commit:

  1. Ch 1 Webster *intelligence* — replaced manuscript's "understanding; skill; the faculty
     of understanding" (the phrase "skill" is absent from canon, triply confirmed against
     webster-mcp + JSON file + 1828.ibeco.me canonical seed path) with verbatim canon from
     senses 1 and 2: "the exercise of the understanding" and "the capacity to know or
     understand."

  2. T1 (Ch 0 vs Ch 5 redundancy) — Path B (differentiate by binding question). Ch 0 stays
     including the "not magic conjurers" close. Ch 5's Engineering Parallel rewritten to
     pivot from re-deriving vector-space math (now owned by Ch 0) to the posture/practice
     angle. Opens with "Chapter 0 mapped the physics... what that physics demands of us is
     a posture." Pulls warmth-over-distance from the workspace covenant as the practice
     discipline.

  3. T4 (Ch 7 four-element delegation schema) — sharpened. Authority/scope/capacity/identity
     now read as discovery from Matthew 10:1-16 with each element anchored to its specific
     verse. Authority = v.1; Scope = v.5-6; Capacity = v.8 (gift) + v.19-20 (supplementation);
     Identity = v.16.

  4. Ch 6 honest-footnote — sidebar format ratified, receipt-style voice, ~150 words.
     Placeholder text added at end of Ch 6 inside a .production-note div. Michael will do
     voice surgery in a separate pass. Cites D&C 82:10 ("when ye do not what I say, ye have
     no promise") as the pattern. Names what happened: 3 manuscript errors, 4 audit-trail
     errors, one fabricated D&C 104:11-12 quote.

  5. T2 (11-step cycle enumeration) — NEW file at src/chapters/00_eleven_step_reference.md.
     Verb-paired list with the seven verbs from the 2026-05-23 Episode 2 teaching script.
     Step 8 (Atonement) verb refined from "recovering" to "re-aiming" per Michael's pointer
     to study/hope-and-the-grammar-of-pairs.md ("Repentance, in this frame, is not first a
     re-doing of behavior but a re-aiming of the eye"). Color enabled: two muted hues —
     slate-blue for engineering disciplines (1/4/5/6), sage/amber for the seven the
     framework does not reach. Inline [eng] tags on engineering steps. Closing beat
     borrowed from Episode 2: "Four down. Seven to go. The seven are not more organizing."
     book.yaml reordered to place this between Introduction and Ch 0 in standard reading
     order; this reorders Michael's original (Ch 0 before Introduction) — flagged for his
     final say.

  6. T3 (vibe coding) — left as-is. The em-dash inline definition does the work.

  7. T5 (I vs we pronoun shifts) — convention note added to Preface. Voice audit confirmed
     the book already follows the convention: all "I" instances are personal experience
     (Preface chronology) or first-person commitments in Becoming Commitment sections. No
     conversions needed.

  8. Minor bundle — Trejo URL updated from tonytrejodev.medium.com 302-redirect source to
     medium.com/codetodeploy canonical destination. Ch 5 D&C 88:32 styling fixed (covered
     in item 2 above).

