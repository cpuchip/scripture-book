discoveries:
  - Convergence-as-signal held again. Four independent uncolored methods landing on
    the same glossary contradiction and the same vulnerability-is-credibility theme
    is far stronger evidence than any single reviewer.
  - The uncolored-subagents call was right. The fresh personas caught the early-
    chapter "I will" vs late-chapter "I aim" honesty seam (T2.1) that a briefed
    reader would have rationalized as already-handled.
  - SUBSTRATE QUIRK 1 — the MCP start_brainstorm `models` param has a broken JSON
    schema (declares array-of-int, not object); passing the per-lens object fails
    client-side validation. Workaround: call stewards.start_brainstorm() SQL
    directly via psql (signature in extension/j9c-start-brainstorm-lenses.sql,
    8 args, p_models jsonb + p_lenses text[]).
  - SUBSTRATE QUIRK 2 — when dispatched via the SQL function directly (not the MCP
    wrapper), the aggregate `destination` does NOT propagate to materialization;
    the synthesis lands in work_items.stage_results->'aggregate'->>'output' but no
    file is written. Recovered it from the DB by hand.
  - MODEL NOTE — qwen3.7-max hard-failed at lens dispatch (empty stage_results);
    glm-5 completed-but-empty on the disney pipeline. Both re-fired fine on
    kimi-k2.5 / deepseek-v4-flash. The free models (deepseek-v4-flash, mimo-v2.5)
    performed well across 4 lenses at $0 — good default for future fan-out.
  - The disney lens (deepseek) produced the vivid exemplar of the structural dual-
    audience idea: a Talmud-style margin/center layout where the page IS the fusion.
