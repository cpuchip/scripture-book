  Six passes:
    01 editor (in-house) — read all 16 chapters + front matter fresh.
    03 gospel-reader — research-gospel subagent, uncolored (wary faithful Saint persona).
    04 ai-reader — research subagent, uncolored (skeptical senior engineer persona).
