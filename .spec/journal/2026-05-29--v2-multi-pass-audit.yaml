  KEY decision from Michael before the run: do NOT brief the subagents on our
  ratified decisions — fresh, uncolored eyes. The ratified-decisions filter lives
  only in the COUNCIL's "Rejects" bucket. This proved its worth: the uncolored
  passes converged hard without any coaching.

  Convergence (the quality signal): T1.1 glossary-contradicts-chapters flagged by
  4 passes (editor/gospel/ai/editing-research) — incl. a flatly FALSE technical
  claim ("overfitting causes compilation errors"). T1+.B vulnerability-is-the-
  credibility-engine flagged by 4 passes. T1.2 Ch9-too-long-and-EP-weakest by 3.
  T1.3 "the analogy must break to be trusted / keep the limit-naming" by 4 — which
  is the COUNTERWEIGHT to the editor's "vary the verbatim refrain": keep the move,
  vary the wording.

  Fact-check: ZERO quote drift across 28+ citations — the heavy rebuilds did not
  corrupt a single verse. Both Webster 1828 quotes (spirit, intelligence) exact.
  Three real errors: FC-1 Ch11 misdates Nelson "The Sabbath Is a Delight" as Oct
  2015 (it's April 2015); FC-2 Ch9 "molting/molted" should be "molten" (Ether 3:1);
