  Ch 3 — Becoming app locator (T6).
    Old: "(the Becoming app)"
    New: "(the [Becoming app](https://ibeco.me))"
    Reason: review Section 4 flagged that the chapter referenced the app concretely but
    gave the reader no way to find it. One-line fix.

  Ch 4 — Abraham 5:2 misattribution paragraph rewrite.
    Old: "In Abraham 5:2, we read that on the seventh day the Gods rested and 'counseled
    among themselves.' This was a session of reflection..."
    New: "Abraham 5:2 names the seventh time as the rest 'from all our work which we have
    counseled' — the entire creative arc bracketed by counsel on the front and rest on the
    back. The Moses account makes the evaluation step explicit: on the seventh day God
    'saw that they were good' (Moses 3:2). The Sabbath is not a pause from creation; it is
    the step where the whole system is evaluated as a unit and pronounced good."
    Reason: the phrase "counseled among themselves" does not appear in Abr 5:2 — it
    appears in Abr 4:26 and 5:3. The chapter's theological point (sabbath as evaluation
    moment) is preserved; the scriptural anchor is corrected. Moses 3:2 added as the
    explicit "saw that they were good" verse since Abr 5:2 doesn't actually make the
    evaluation claim.

