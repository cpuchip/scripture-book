summary: |
  Following the morning's audit + provenance redemption commit (65b0a4f), Michael authorized
  applying the manuscript fixes that did not require council. Three fixes landed:

  Ch 0 — cite range correction.
    Old: "[Doctrine and Covenants 84:44-45]" with URL anchor verse=44-45.
