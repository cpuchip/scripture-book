summary: |
  The most important session of the revision so far — not for what got edited
  (nothing did) but for what got SEEN. After Batch 2 shipped, two threads ran:

  1. THE 3RD-PASS / TOOLING THREAD (set down, handed off):
     - Tried a generative multi-model "redline the book" pass via the substrate.
       Failed: the pg-ai-stewards lens fs sandbox can't read the manuscript
       (allow-list scoped to .spec/journal etc.). Wrote the use-case + failure +
       enabling options to /.spec/proposals/substrate-multimodel-document-redline.md.
       The stew (pg-ai-stewards) session then RATIFIED + SHIPPED it (R.1–R.6:
       `redline` pipeline + `panel_redline` / `panel_redline_condense`), MCP-rebuild
       pending. So the capability is coming.
     - As a stopgap, learned to drive Gemini 3.5 Flash headless via the `agy` CLI
       and wrote the **agy-cli skill** (.claude/skills/agy-cli/). Two bugs solved:
       headless `-p` hangs on stdin (fix: `$null | agy -p ...`) and drops stdout
       (fix: read the newest ~/.gemini/antigravity-cli/brain/<id>/.../transcript.jsonl).
       Run from workspace ROOT + absolute paths + "don't search". Verified end-to-end
       on a real imago-Dei voicing audit; running from root (with workspace voice
       rules) produced markedly less-ornate, more first-person proposals than from
       the book dir — confirmed Michael's "run from root" instinct.

  2. THE IDENTITY THREAD (the real work):
     Michael, reading the book himself and editing into his voice, surfaced a
     foundational doubt: too doctrine-heavy/preachy, doesn't actually TEACH AI,
     and describes an ASPIRATIONAL practice vs. how he really works. He named the
     current identity ("a gospel book that applies gospel principles to working
     with AI") and floated TWO BOOKS: a short practice-forward TL;DR (the inverse)
     + the current doctrine-forward book; wants them fused if possible.

     I did NOT reassure the doubt away (Ben). I agreed it's accurate — because our
     own v2 audit had already flagged the symptoms — and recommended STOPPING the
     editing/polish line entirely (the unease is structural, not prose). Gave a
     4-question reading lens. Mined ~/.claude + ~/.copilot for evidence
     (.draft/20260530-how-we-actually-work.md).

     The mining REFRAMED the worry usefully: the gap is the doctrine-to-how-to
     RATIO, not false claims of mastery — the book is already mid-correction (the
     "I am still practicing them" edits, the "ones I keep poorly" preface line, the
     Ben-Test downgrades). And his REAL creative method is "discover the vision by
     iterating," not spec-first (spec-first is real but mostly for code, and the
     spec-shaped prompts were generated by his own becoming app). ~10 teachable
     techniques live in his real practice and are absent from the book — that's
     Book-1's raw material.
discoveries:
  - "Discover the vision by iterating" is Michael's true creative method and a
    teachable gospel principle the book doesn't yet name — you don't always see the
    whole spiritual creation before you begin; you find it line upon line. This may
    be the missing spine of a practice-forward Book 1.
  - The right diagnosis of "too preachy" is RATIO, not dishonesty. Fix = add the
    teaching (the how-to from real practice), not gut the doctrine. The doctrine
    earns its place when it illuminates the craft AND names its limit (the AI-reader
    leaned in only at the honest-limit moments).
  - "The fix is almost never less Christ; it's less claim." Calibrate aspiration,
    keep the witness.
  - Covenant worked again: flag_when_wrong (Michael's own self-critique) + agent NOT
    flattering it. The most honest line in his whole corpus is the Sabbath admission
    — worth honoring somewhere in the book.
  - Multi-model voice editing imports the editor model's register (Gemini drifts
    ornate); run from root with the voice rules loaded to constrain it; treat output
    as a menu, human picks. Confirmed.
