discoveries:
  - PyMuPDF (fitz) renders PDF pages to PNG with no external binary, where this
    box's pdftoppm is unavailable. This unlocked REAL visual verification of print
    layout (render page -> view the image), including QR alignment and page breaks —
    the inverse-hypothesis discipline applied to typography. Margin-strip crops at
    high zoom (clip rect + Matrix(4-5x)) make QR placement and collision unambiguous.
  - Typst place(left/right + horizon) INSIDE a rect centers the placed item on that
    block's vertical midpoint — the clean way to center a margin QR on a multi-line
    blockquote regardless of where in the quote text the call sits (placement is out
    of flow). The inline (non-blockquote) case needs a fixed dy instead (~-0.32in to
    center a 0.85in card on its line); one function can't serve both, hence the split.
  - Typst internal links (link(<label>)) emit as PDF NAMED destinations, reported by
    fitz as kind 4 (not LINK_GOTO=1); PDF viewers treat them as clickable jumps. The
    displayed "(p. NN)" and the link target can't disagree — both resolve the SAME
    label. fitz get_links() 'page' is 0-indexed (target index 38 = printed page 39).
  - A clean Typst compile is itself meaningful verification for the cross-refs: Typst
    ERRORS on an unresolved or duplicate label inside counter(page).at(<label>), so a
    successful build proves every chapter anchor resolves to exactly one location.
  - LESSON on listening: "page break so the content is on the next page" is ambiguous
    when a chapter opens with boxes. The first cut read "content" as everything-after-
    the-title (title alone); Michael meant the PROSE — boxes belong with the title.
    Should have asked which unit, or shown the cheaper interpretation first. He caught
    it kindly and the fix was small, but naming the unit up front would have saved a
    build. (Consistent with feedback_michael_voice_kindness.)
  - EB Garamond letter-tracking still garbles PyPDF2/fitz text extraction (phrases
    split mid-word), so space-stripped substring search gives false hits across the
    whole doc (e.g. "watched those things" from Abr 4:18 matches every chapter that
    quotes it). Locate pages by a DISTINCTIVE phrase, then render to confirm.
