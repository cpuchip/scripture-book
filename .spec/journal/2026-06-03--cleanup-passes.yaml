discoveries:
  - A programmatic QR-collision detector (PyMuPDF get_drawings -> rects ~55-66pt
    square = the 0.85in QR card border -> flag vertical overlaps per page) sweeps the
    WHOLE book for overlapping margin QRs in one pass — far better than eyeballing 60+
    pages. Reusable for any future QR work. Caught 2 real collisions this session.
  - Verse anchors come free from the link TEXT: scripture refs are written "Book C:V"
    so the verse is already on the page; a script can lift it into ?verse= and the
    paired [qr] inherits it (qr text is just "qr", so sync to the preceding scripture
    link). resolve_gospel_path already turned ?verse=N into the church's
    ?lang=eng&id=pN#pN highlight URL — the markdown just never carried the verse.
  - The opener page-break belongs at the FIRST divider (right after the anchor), not
    before the first section: that keeps any intro block (Ch2's "for the reader"
    note) with the body instead of stranding it. The earlier "before first ==" rule
    silently orphaned content that lives between the anchor and the first heading.
  - Heading titles must set hyphenate:false AND justify:false: hyphenate off stops
    "Noth-/ing"; justify off stops a wrapped first line from stretching while the
    last line centers (the inconsistent look 2-line titles otherwise get).
  - The new subtitle was already written in the book — the afterword's climactic
    sentence names it. The strongest titles are often a phrase the manuscript already
    earned, not a fresh coinage.
  - Disposable scripts in gitignored dist/ (qr_pass.py, verse_links.py) are the right
    tool for book-wide mechanical edits: deterministic, diff-reviewable, never
    committed. Same pattern as the into-src migration script.
carry_forward:
