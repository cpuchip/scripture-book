discoveries:
  - The drafts carried bracket placeholders with no URL ([Abraham 4:26],
    [Part 2: ...]) that the plan's "strip comments + convert" step under-named;
    they would have rendered as literal broken brackets. Resolving them was the
    real work, not the file-add.
  - Neither build path stripped HTML comments, so the .draft comment blocks HAD
    to be removed at conversion (confirmed the plan's measured-risk read).
  - Part-divider half-title is best represented as three FLAT divs, not nested
    ones - nested divs break build_typst.py's non-greedy </div> match; flat
    divs let each build parse cleanly AND let HTML style each line.
  - A deterministic migration script beats hand-retyping 10 long files for
    quote fidelity (the verify-gate) - and is disposable.
  - PyPDF2 text extraction garbles tracked/justified serif text (PART ONE ->
    "P A R T  O N E"; "fourteen" -> "fourte en"), so a NOT-FOUND on a substring
    search is not a rendering failure - dump the page to see the truth.
