      to Zion" = current Ch 12). The completion pass renumbered chapters but not
      the provenance files; the new Sabbath Ch 11 and the Ch 14 Afterword have no
      provenance file. Renumbering drift in the exact area the 2026-05-26
      redemption addressed. Flagged, not fixed -- needs a dedicated pass to
      renumber and write the missing provenance files.
